[project]
name = "tasche"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.129.0,<0.130",
    "markdownify>=1.2.2,<1.3",
    "httpx>=0.28.1,<0.29",
    "beautifulsoup4>=4.14.3,<4.15",
]

[dependency-groups]
workers = ["workers-py"]
test = [
    "hypothesis>=6.151.9",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff==0.16.0",
]

# Install test + workers groups by default so a fresh clone can run
# `make test` (pytest/ruff) and `make dev` (pywrangler) after plain `uv sync`.
[tool.uv]
default-groups = ["test", "workers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
required-version = "==0.16.0"
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
